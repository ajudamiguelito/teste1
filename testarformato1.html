<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravador TNP MoB - WhatsApp Fix</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background: #15110f;
        color: #fff;
        font-family: Arial, sans-serif;
    }
    .card {
        background: #241c18;
        border: 1px solid rgba(220, 180, 140, 0.25);
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 16px;
        text-align: center;
    }
    button {
        width: 100%;
        min-height: 54px;
        border: none;
        border-radius: 14px;
        margin-top: 12px;
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        background: #6d3a24;
        cursor: pointer;
    }
    button.whatsapp {
        background: #25D366;
    }
    button.parar {
        background: #982b22;
    }
    .status {
        color: #f0d2b2;
        font-size: 18px;
        margin: 15px 0;
        font-weight: bold;
    }
    audio {
        width: 100%;
        margin-top: 15px;
    }
    #log {
        font-size: 12px;
        color: #888;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="card">
    <h2>🎙️ Gravador de Áudio</h2>
    <p>Focado no formato <b>WebM</b> com truque de compatibilidade para WhatsApp.</p>
    
    <div id="controles">
        <button id="btnGravar" onclick="iniciar()">🔴 Iniciar Gravação</button>
        <button id="btnParar" class="parar" onclick="parar()" style="display:none;">⏹️ Parar</button>
    </div>

    <div id="resultado" style="display:none;">
        <div class="status" id="timer">00:00</div>
        <audio id="player" controls></audio>
        <button class="whatsapp" onclick="compartilhar()">📤 Enviar para WhatsApp</button>
        <button onclick="resetar()">🗑️ Descartar e Novo</button>
    </div>
    
    <div id="log">Aguardando...</div>
</div>

<script>
let recorder;
let chunks = [];
let stream;
let audioBlob;
let startTime;
let timerInterval;

function log(msg) {
    document.getElementById('log').innerText = msg;
    console.log(msg);
}

async function iniciar() {
    chunks = [];
    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Tentamos o webm puro que você prefere
        const options = { mimeType: 'audio/webm' };
        recorder = new MediaRecorder(stream, options);
        
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = processar;
        
        recorder.start();
        startTime = Date.now();
        timerInterval = setInterval(atualizarTimer, 1000);
        
        document.getElementById('btnGravar').style.display = 'none';
        document.getElementById('btnParar').style.display = 'block';
        document.getElementById('resultado').style.display = 'none';
        log("Gravando...");
    } catch (err) {
        alert("Erro ao acessar microfone: " + err);
    }
}

function atualizarTimer() {
    const segs = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(segs / 60)).padStart(2, '0');
    const s = String(segs % 60).padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
}

function parar() {
    recorder.stop();
    stream.getTracks().forEach(t => t.stop());
    clearInterval(timerInterval);
    document.getElementById('btnParar').style.display = 'none';
    document.getElementById('btnGravar').style.display = 'block';
}

function processar() {
    audioBlob = new Blob(chunks, { type: 'audio/webm' });
    const url = URL.createObjectURL(audioBlob);
    document.getElementById('player').src = url;
    document.getElementById('resultado').style.display = 'block';
    log("Pronto para enviar.");
}

async function compartilhar() {
    if (!audioBlob) return;

    /* 
       TRUQUE DE COMPATIBILIDADE:
       O WhatsApp muitas vezes rejeita .webm vindo do navegador com esse erro de "algo errado".
       Ao renomear para .ogg ou .mp3 (mesmo sendo webm por dentro), o WhatsApp 
       costuma processar o arquivo corretamente através da Web Share API.
    */
    const nomeArquivo = "audio-" + Date.now() + ".ogg"; 
    
    // Criamos o arquivo "disfarçado"
    const file = new File([audioBlob], nomeArquivo, { type: 'audio/ogg' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            log("Abrindo WhatsApp...");
            await navigator.share({
                files: [file],
                title: 'Áudio TNP',
                text: ''
            });
            log("Enviado!");
        } catch (err) {
            log("Erro ou cancelado: " + err.message);
        }
    } else {
        alert("Seu navegador não suporta compartilhamento de arquivos.");
    }
}

function resetar() {
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('timer').innerText = "00:00";
    log("Aguardando...");
}
</script>

</body>
</html>
