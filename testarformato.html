<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Link de Pagamento TNP</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top center, rgba(205, 170, 135, 0.16), transparent 35%),
                linear-gradient(180deg, #1d1a17 0%, #12100f 100%);
            color: #ffffff;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: rgba(34, 29, 25, 0.96);
            border: 1px solid rgba(211, 176, 140, 0.28);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            text-align: center;
        }

        .sub {
            margin: 0 0 18px;
            color: #d1b59c;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
        }

        .grupo {
            margin-bottom: 13px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #d8b48e;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            min-height: 44px;
            border: 1px solid rgba(211, 176, 140, 0.25);
            border-radius: 13px;
            background: #171310;
            color: #ffffff;
            padding: 10px 12px;
            outline: none;
            font-size: 14px;
        }

        textarea {
            min-height: 76px;
            resize: vertical;
        }

        button {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 15px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            color: #ffffff;
            background: linear-gradient(180deg, #7a4429 0%, #60331f 100%);
            margin-top: 10px;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-verde {
            background: linear-gradient(180deg, #27864f 0%, #1d673d 100%);
        }

        .btn-amarelo {
            background: linear-gradient(180deg, #b47a25 0%, #8a5a18 100%);
        }

        .resultado {
            display: none;
            margin-top: 18px;
            border-top: 1px solid rgba(211, 176, 140, 0.18);
            padding-top: 16px;
        }

        .status {
            margin-top: 14px;
            padding: 13px;
            border-radius: 16px;
            background: rgba(211, 176, 140, 0.10);
            border: 1px solid rgba(211, 176, 140, 0.18);
            color: #f2d7bd;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
            word-break: break-word;
        }

        .status.pago {
            background: rgba(39, 134, 79, 0.18);
            border-color: rgba(39, 134, 79, 0.38);
            color: #bff3d3;
        }

        .status.erro {
            background: rgba(150, 40, 35, 0.18);
            border-color: rgba(210, 70, 55, 0.38);
            color: #ffc5bd;
        }

        .info-link {
            font-size: 12px;
            color: #d1b59c;
            word-break: break-all;
            margin-top: 8px;
            text-align: center;
        }

        .linha {
            height: 1px;
            background: rgba(211, 176, 140, 0.15);
            margin: 18px 0;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🔗 Link de Pagamento TNP</h1>
    <p class="sub">
        Tela simples para testar criação de link, abertura do pagamento e confirmação automática pelo webhook.
    </p>

    <div class="grupo">
        <label>E-mail do usuário teste</label>
        <input type="email" id="email" placeholder="seu@email.com">
    </div>

    <div class="grupo">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Senha do Firebase">
    </div>

    <button type="button" onclick="TNP_LINK_func_loginTeste()">
        Entrar no Firebase
    </button>

    <div id="statusLogin" class="status">
        Faça login para gerar o link.
    </div>

    <div class="linha"></div>

    <div class="grupo">
        <label>Valor</label>
        <input type="text" id="valor" placeholder="Ex: 1,00" inputmode="decimal" value="1,00">
    </div>

    <div class="grupo">
        <label>Título</label>
        <input type="text" id="titulo" value="Teste Link TNP MoB">
    </div>

    <div class="grupo">
        <label>Descrição</label>
        <textarea id="descricao">Teste de pagamento por link TNP MoB</textarea>
    </div>

    <button type="button" id="btnGerar" onclick="TNP_LINK_func_gerarLink()" disabled>
        Gerar link de pagamento
    </button>

    <div id="resultado" class="resultado">
        <div id="statusPagamento" class="status">
            Aguardando geração do link...
        </div>

        <button type="button" id="btnAbrirLink" class="btn-verde" onclick="TNP_LINK_func_abrirLink()" style="display:none;">
            Abrir link de pagamento
        </button>

        <button type="button" id="btnVerificar" class="btn-amarelo" onclick="TNP_LINK_func_verificarPagamento()" style="display:none;">
            Verificar pagamento
        </button>

        <div id="infoLink" class="info-link"></div>
    </div>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>

<script>
    // COLE AQUI A MESMA CONFIGURAÇÃO FIREBASE DO SEU APP
    const PRIMEIRAPAG_Login_config_firebase = {
		apiKey: "AIzaSyAN13M1GGwYmyQA4131HB23cGX1SLWmlsQ",
		authDomain: "tnp-mob.firebaseapp.com",
		projectId: "tnp-mob",
		storageBucket: "tnp-mob.firebasestorage.app",
		messagingSenderId: "775995955512",
		appId: "1:775995955512:web:07d865e4480e0bf33909cd"
	};

	firebase.initializeApp(PRIMEIRAPAG_Login_config_firebase);

	var TNP_LINK_auth = firebase.auth();
	var TNP_LINK_db = firebase.firestore();
	var TNP_LINK_functions = firebase.functions();

	var TNP_LINK_auth = firebase.auth();
	var TNP_LINK_db = firebase.firestore();
	var TNP_LINK_functions = firebase.functions();

	var TNP_LINK_linkPagamentoId = "";
	var TNP_LINK_urlPagamento = "";
	var TNP_LINK_unsubscribe = null;
	var TNP_LINK_gerando = false;

    function TNP_LINK_func_mostrarStatusLogin(msg, tipo) {
        const el = document.getElementById("statusLogin");
        if (!el) return;

        el.className = "status" + (tipo ? " " + tipo : "");
        el.innerText = msg;
    }

    function TNP_LINK_func_mostrarStatusPagamento(msg, tipo) {
        const el = document.getElementById("statusPagamento");
        if (!el) return;

        el.className = "status" + (tipo ? " " + tipo : "");
        el.innerText = msg;
    }

    function TNP_LINK_func_converterValor(valorDigitado) {
        const limpo = String(valorDigitado || "")
            .replace(/\s/g, "")
            .replace("R$", "")
            .replace(/\./g, "")
            .replace(",", ".");

        const numero = Number(limpo);

        if (!Number.isFinite(numero)) {
            return 0;
        }

        return Math.round(numero * 100) / 100;
    }

    async function TNP_LINK_func_loginTeste() {
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value.trim();

        if (!email || !senha) {
            TNP_LINK_func_mostrarStatusLogin("Preencha e-mail e senha.", "erro");
            return;
        }

        try {
            TNP_LINK_func_mostrarStatusLogin("Entrando...", "");

            await TNP_LINK_auth.signInWithEmailAndPassword(email, senha);

            document.getElementById("btnGerar").disabled = false;

            TNP_LINK_func_mostrarStatusLogin(
                "Login confirmado. Agora você pode gerar o link.",
                "pago"
            );

        } catch (erro) {
            console.error("Erro login:", erro);
            TNP_LINK_func_mostrarStatusLogin(
                "Erro ao fazer login: " + (erro.message || erro),
                "erro"
            );
        }
    }

    async function TNP_LINK_func_gerarLink() {
        if (TNP_LINK_gerando) return;

        const user = TNP_LINK_auth.currentUser;

        if (!user) {
            TNP_LINK_func_mostrarStatusLogin("Você precisa fazer login primeiro.", "erro");
            return;
        }

        const valor = TNP_LINK_func_converterValor(document.getElementById("valor").value);
        const titulo = document.getElementById("titulo").value.trim();
        const descricao = document.getElementById("descricao").value.trim();

        if (!valor || valor < 0.01) {
            TNP_LINK_func_mostrarStatusPagamento("Valor inválido.", "erro");
            return;
        }

        if (!titulo || titulo.length < 3) {
            TNP_LINK_func_mostrarStatusPagamento("Título inválido.", "erro");
            return;
        }

        TNP_LINK_gerando = true;

        const btnGerar = document.getElementById("btnGerar");
        const resultado = document.getElementById("resultado");
        const btnAbrir = document.getElementById("btnAbrirLink");
        const btnVerificar = document.getElementById("btnVerificar");
        const infoLink = document.getElementById("infoLink");

        try {
            if (btnGerar) {
                btnGerar.disabled = true;
                btnGerar.innerText = "Gerando link...";
            }

            if (resultado) resultado.style.display = "block";
            if (btnAbrir) btnAbrir.style.display = "none";
            if (btnVerificar) btnVerificar.style.display = "none";
            if (infoLink) infoLink.innerText = "";

            TNP_LINK_func_mostrarStatusPagamento("Gerando link de pagamento na TNP...", "");

            const gerarLink = TNP_LINK_functions.httpsCallable("gerarLinkPagamentoTesteTNP");

            const resposta = await gerarLink({
                valor: valor,
                titulo: titulo,
                descricao: descricao
            });

            const dados = resposta.data || {};

            if (!dados.ok || !dados.linkPagamentoId || !dados.urlPagamento) {
                throw new Error("A função não retornou o link corretamente.");
            }

            TNP_LINK_linkPagamentoId = String(dados.linkPagamentoId);
            TNP_LINK_urlPagamento = String(dados.urlPagamento);

            TNP_LINK_func_mostrarStatusPagamento(
                "Link criado. Aguardando pagamento...",
                ""
            );

            if (btnAbrir) btnAbrir.style.display = "block";
            if (btnVerificar) btnVerificar.style.display = "block";
            if (infoLink) {
                infoLink.innerText =
                    "ID: " + TNP_LINK_linkPagamentoId + "\n" +
                    "URL: " + TNP_LINK_urlPagamento;
            }

            TNP_LINK_func_ouvirPagamento(TNP_LINK_linkPagamentoId);

        } catch (erro) {
            console.error("Erro ao gerar link:", erro);

            TNP_LINK_func_mostrarStatusPagamento(
                "Erro ao gerar link: " + (erro.message || erro),
                "erro"
            );

        } finally {
            TNP_LINK_gerando = false;

            if (btnGerar) {
                btnGerar.disabled = false;
                btnGerar.innerText = "Gerar link de pagamento";
            }
        }
    }

    function TNP_LINK_func_abrirLink() {
        if (!TNP_LINK_urlPagamento) {
            TNP_LINK_func_mostrarStatusPagamento("Nenhum link gerado ainda.", "erro");
            return;
        }

        window.open(TNP_LINK_urlPagamento, "_blank");
    }

    function TNP_LINK_func_ouvirPagamento(linkPagamentoId) {
        if (TNP_LINK_unsubscribe) {
            TNP_LINK_unsubscribe();
            TNP_LINK_unsubscribe = null;
        }

        TNP_LINK_unsubscribe = TNP_LINK_db
            .collection("pagamentosTnpLinks")
            .doc(String(linkPagamentoId))
            .onSnapshot(function (doc) {
                if (!doc.exists) {
                    TNP_LINK_func_mostrarStatusPagamento(
                        "Documento do pagamento ainda não encontrado.",
                        ""
                    );
                    return;
                }

                const dados = doc.data() || {};

                if (dados.status === "pago") {
                    TNP_LINK_func_mostrarStatusPagamento(
                        "✅ Pagamento confirmado com sucesso!",
                        "pago"
                    );

                    return;
                }

                if (dados.status === "erro") {
                    TNP_LINK_func_mostrarStatusPagamento(
                        "Pagamento com erro.",
                        "erro"
                    );

                    return;
                }

                TNP_LINK_func_mostrarStatusPagamento(
                    "Status atual: " + (dados.status || "aguardando_pagamento"),
                    ""
                );
            }, function (erro) {
                console.error("Erro listener:", erro);

                TNP_LINK_func_mostrarStatusPagamento(
                    "Erro ao ouvir pagamento: " + (erro.message || erro),
                    "erro"
                );
            });
    }

    async function TNP_LINK_func_verificarPagamento() {
        if (!TNP_LINK_linkPagamentoId) {
            TNP_LINK_func_mostrarStatusPagamento("Nenhum pagamento gerado ainda.", "erro");
            return;
        }

        try {
            const snap = await TNP_LINK_db
                .collection("pagamentosTnpLinks")
                .doc(String(TNP_LINK_linkPagamentoId))
                .get();

            if (!snap.exists) {
                TNP_LINK_func_mostrarStatusPagamento(
                    "Pagamento ainda não encontrado no Firestore.",
                    ""
                );
                return;
            }

            const dados = snap.data() || {};

            if (dados.status === "pago") {
                TNP_LINK_func_mostrarStatusPagamento(
                    "✅ Pagamento confirmado com sucesso!",
                    "pago"
                );
            } else {
                TNP_LINK_func_mostrarStatusPagamento(
                    "Ainda não confirmado. Status: " + (dados.status || "aguardando_pagamento"),
                    ""
                );
            }

        } catch (erro) {
            console.error("Erro verificar:", erro);

            TNP_LINK_func_mostrarStatusPagamento(
                "Erro ao verificar pagamento: " + (erro.message || erro),
                "erro"
            );
        }
    }

    TNP_LINK_auth.onAuthStateChanged(function (user) {
        if (user) {
            document.getElementById("btnGerar").disabled = false;

            TNP_LINK_func_mostrarStatusLogin(
                "Logado como: " + (user.email || user.uid),
                "pago"
            );
        }
    });
</script>

</body>
</html>
